
# config for comfyui
# base_path puede apuntar a tu instalación de ComfyUI o a un repositorio central de modelos
comfyui:
  base_path: /ComfyUI/
  is_default: true

  checkpoints:
    models/checkpoints/

  clip:
    models/clip/

  clip_vision:
    models/clip_vision/

  configs:
    models/configs/

  controlnet:
    models/controlnet/

  diffusion_models: |
    models/diffusion_models/
    models/unet/
    /runpod-volume/models/

  embeddings:
    models/embeddings/

  loras: |
    models/loras/
    /runpod-volume/loras/

  text_encoders: |
    models/text_encoders/
    /runpod-volume/text_encoders/

  upscale_models:
    models/upscale_models/

  vae:
    models/vae/
